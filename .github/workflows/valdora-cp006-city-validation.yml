name: Valdora CP006 — Cidade v2 (um disparo)
on:
  push:
    branches: [feat/valdora-cp006-city-visual-ota]
    paths:
      - game/ci/cp006-city-validation.request
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Conteúdo candidato (não publicado)
        uses: actions/checkout@v4
        with:
          ref: feat/valdora-cp006-city-visual-ota
          path: site-work
          persist-credentials: false
      - name: Aplicativo existente CP006 (somente leitura)
        uses: actions/checkout@v4
        with:
          ref: release/valdora-android
          path: app-work
          persist-credentials: false
      - name: Verificar assinatura RSA e SHA-256 da cidade
        run: |
          python3 - <<'PY'
          import json,base64,hashlib,pathlib,subprocess
          site=pathlib.Path("site-work/site/updates/v2")
          manifest=json.loads((site/"manifest.json").read_text())
          assert manifest["revision"]==3
          city=[m for m in manifest["modules"] if m["id"]=="city"][0]
          file=site/"modules/city-2.zip"
          assert len(file.read_bytes())==city["bytes"]
          assert hashlib.sha256(file.read_bytes()).hexdigest()==city["sha256"]
          sig=pathlib.Path("/tmp/valdora-city.sig")
          sig.write_bytes(base64.b64decode(city["signature_b64"],validate=True))
          pub="app-work/game/updates/trust/valdora_ota.pub"
          p=subprocess.run(["openssl","dgst","-sha256","-verify",pub,"-signature",str(sig),str(file)],check=True,capture_output=True,text=True)
          assert "Verified OK" in p.stdout
          print("OTA city-v2 RSA/SHA verified")
          PY
          mkdir -p app-work/game/tests/fixtures
          cp site-work/site/updates/v2/modules/city-2.zip app-work/game/tests/fixtures/
          cp site-work/game/tests/cp006_city2_smoke.gd app-work/game/tests/
      - name: Godot 4.7.2 e teste de cidade
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --editor --path app-work/game --quit
          godot --headless --path app-work/game --script res://tests/cp006_city2_smoke.gd
