name: Valdora CP003-C — arena 3D e motor (sem APK)
on:
  push:
    branches:
      - feat/valdora-cp003c-arena3d
    paths:
      - .github/workflows/valdora-cp003c-arena.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valdora-cp003-combat
  cancel-in-progress: false
jobs:
  validar-motor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Código da branch CP003
        uses: actions/checkout@v4
      - name: Contratos estáticos
        run: |
          set -euo pipefail
          python3 game/tools_validate.py
          python3 game/tests/test_static_contract.py
          python3 game/tests/test_combat_static_contract.py
      - name: Godot 4.7.2 — binário oficial e hash verificado
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Importar projeto e validar sintaxe Godot
        run: |
          set -euo pipefail
          godot --headless --editor --path game --quit
      - name: CP001 — regras econômicas
        run: godot --headless --path game --script res://tests/core_smoke.gd
      - name: CP002 — catálogo e formação
        run: godot --headless --path game --script res://tests/hero_smoke.gd
      - name: CP003 — regras de combate PvE
        run: godot --headless --path game --script res://tests/combat_smoke.gd
      - name: CP003-C — arena visual e integração de cena
        run: godot --headless --path game --script res://tests/smoke.gd
