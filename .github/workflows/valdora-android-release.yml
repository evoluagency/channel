name: Valdora - Android release permanente
on:
  push:
    branches:
      - release/valdora-android
    paths:
      - game/release-control/version.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-e-exportar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fonte de release controlada
        uses: actions/checkout@v4
        with:
          ref: release/valdora-android
          persist-credentials: false
      - name: Preflight — segredos obrigatórios
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VALDORA_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VALDORA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Configure os 2 segredos de assinatura em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar certificado permanente antes de compilar
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VALDORA_ANDROID_KEYSTORE_B64 }}
          VALDORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VALDORA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/valdora-release-android.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$FILE"
          chmod 600 "$FILE"
          ACTUAL="$(keytool -list -v -storetype PKCS12 -alias valdora-release -keystore "$FILE" -storepass:env VALDORA_ANDROID_KEYSTORE_PASSWORD | awk '/SHA256:/{print $2;exit}')"
          EXPECTED="C5:95:06:93:BB:5D:5F:36:EE:B8:A3:8E:F9:A3:52:20:2E:D3:96:2E:68:D3:A2:7F:AC:C6:DB:2A:EC:BD:76:A7"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Certificado divergente: não publicar APK com nova assinatura."
            exit 1
          fi
          echo "Certificado permanente confirmado."
      - name: Testes estáticos
        run: |
          python3 game/tools_validate.py
          python3 game/tests/test_static_contract.py
      - name: Godot 4.7.2 oficial e integridade
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Importar projeto
        run: godot --headless --editor --path game --quit
      - name: Testes Godot de regras e cena
        run: |
          godot --headless --path game --script res://tests/core_smoke.gd
          godot --headless --path game --script res://tests/hero_smoke.gd
          godot --headless --path game --script res://tests/smoke.gd
      - name: Cache dos modelos Android (reduz downloads)
        id: godot-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: valdora-godot-4.7.2-android-templates-v1
      - name: Modelos Android oficiais
        if: steps.godot-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz" | sha256sum -c -
          mkdir -p /tmp/godot-export ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" -d /tmp/godot-export
          cp /tmp/godot-export/templates/android_debug.apk /tmp/godot-export/templates/android_release.apk /tmp/godot-export/templates/version.txt ~/.local/share/godot/export_templates/4.7.2.stable/
          rm /tmp/templates.tpz
      - name: Instalar ferramentas Android do runner
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Preparar Android SDK para release
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          mkdir -p ~/.config/godot
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          p = Path.home()/'.config/godot/editor_settings-4.7.tres'
          content = p.read_text() if p.exists() else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          content += '\nexport/android/java_sdk_path = "'+os.environ['JAVA_HOME']+'"\n'
          content += 'export/android/android_sdk_path = "'+os.environ['ANDROID_HOME']+'"\n'
          p.write_text(content)
          PYTHON
      - name: Exportar release Android assinada
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/valdora-release-android.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: valdora-release
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.VALDORA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p game/dist
          godot --headless --path game --export-release Android "$PWD/game/dist/Valdora.apk"
          test -s game/dist/Valdora.apk
          stat -c '%n %s bytes' game/dist/Valdora.apk
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.1/aapt" dump badging game/dist/Valdora.apk | grep -m1 "^package:" | tee game/dist/PACKAGE.txt
          grep -q "name='ink.evolu.valdora'" game/dist/PACKAGE.txt
          grep -q "versionCode='100'" game/dist/PACKAGE.txt
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.1/apksigner" verify --verbose --print-certs game/dist/Valdora.apk > game/dist/SIGNATURE.txt
          grep -iq "c5950693bb5d5f36eeb8a38ef9a352202ed3962e68d3a27facc6db2aecbd76a7" game/dist/SIGNATURE.txt || {
            echo "::error::Assinatura do APK não corresponde ao certificado permanente."
            exit 1
          }
          sha256sum game/dist/Valdora.apk > game/dist/SHA256.txt
      - name: Limpar chave privada temporária
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/valdora-release-android.p12"
      - name: Artefato APK
        uses: actions/upload-artifact@v4
        with:
          name: Valdora-Android-Release
          path: |
            game/dist/Valdora.apk
            game/dist/SHA256.txt
            game/dist/PACKAGE.txt
            game/dist/SIGNATURE.txt
          retention-days: 7
          if-no-files-found: error
