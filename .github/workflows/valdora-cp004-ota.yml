name: Valdora CP004 — validação OTA (manual, sem APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ota-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Contratos estáticos
        run: |
          python3 game/tools_validate.py
          python3 game/tests/test_static_contract.py
          python3 game/tests/test_combat_static_contract.py
          python3 game/tests/test_ota_contract.py
          python3 tools/ota_manifest.py --verify-existing
          mkdir -p game/tests/fixtures
          cp site/updates/v2/manifest.json game/tests/fixtures/manifest.json
          cp site/updates/v2/modules/welcome-1.zip game/tests/fixtures/welcome-1.zip
          cp site/updates/v2/modules/city-8.zip game/tests/fixtures/city-8.zip
      - name: Godot oficial e hash
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Importação e teste CP010
        run: |
          godot --headless --editor --path game --quit
          timeout 70s godot --headless --path game --script res://tests/cp010_city_v8_smoke.gd
